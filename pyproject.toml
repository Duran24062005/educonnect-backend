[project]
name = "educonnect-backend"
version = "0.1.0"
description = "EduConnect Backend - FastAPI application for educational management"
requires-python = ">=3.10"
authors = [
    { name = "EduConnect Contributors", email = "admin@educonnect.local" }
]
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi==0.128.0",
    "uvicorn[standard]==0.40.0",
    "pydantic==2.12.5",
    "SQLAlchemy==2.0.46",
    "alembic==1.11.1",
    "passlib[bcrypt]==1.7.4",
    "python-jose==3.3.0",
    "psycopg2-binary==2.9.9",
    "email-validator==2.0.0",
    "httpx>=0.24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.1",
    "httpx>=0.24.1",
]

[project.urls]
Homepage = "https://github.com/Duran24062005/educonnect-backend"
Repository = "https://github.com/Duran24062005/educonnect-backend.git"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*"]


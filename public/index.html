<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
        }
        .container {
            display: flex;
            justify-content: center;
            margin-top: 13%;
            border: 3px solid white;
            border-radius: 100%;
            box-shadow: 10px 5px 0.5px red;
        }
        img {
            width: 50%;
            height: 30%;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://educonnect-backend-rouge.vercel.app/uploads/img.jpeg" alt="">
    </div>
</body>
</html>

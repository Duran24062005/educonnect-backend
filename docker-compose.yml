services:
  # Servicio de API Node.js
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: educonnect-api
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - NODE_ENV=development
      - PORT=8000
      - MONGO_URI_CLOUD=${MONGO_URI_CLOUD}
      - JWT_SECRET=${JWT_SECRET:-tu-secreto-super-seguro-cambiar-en-produccion}
      - JWT_EXPIRE=${JWT_EXPIRE:-7d}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    networks:
      - educonnect-network
    restart: unless-stopped

  # Servicio de MongoDB
  mongodb:
    image: mongo:7
    container_name: educonnect-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: educonnect
    volumes:
      - mongo-data:/data/db
    networks:
      - educonnect-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  educonnect-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: educonnect-backend
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-8000}
      DATABASE_URL: ${DATABASE_URL:-mongodb://admin:admin123@mongodb:27017/educonnect?authSource=admin}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      EMAIL_API_BASE_URL: ${EMAIL_API_BASE_URL:-http://localhost:8001}
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
    networks:
      - educonnect-network
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: educonnect-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: educonnect
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - educonnect-network
    restart: unless-stopped

networks:
  educonnect-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
